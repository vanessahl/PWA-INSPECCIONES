name: Week 05 Sync Data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production app
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Verify project artifacts
        run: npm run verify
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week-05-sync-evidence
          if-no-files-found: ignore
          path: reports/verification.json